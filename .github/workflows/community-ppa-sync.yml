name: Check upstream releases for the community PPA

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: community-ppa-release-check
  cancel-in-progress: false

jobs:
  check:
    name: Detect a new stable upstream release
    runs-on: ubuntu-24.04

    steps:
      - name: Validate community PPA configuration
        env:
          PPA_TARGET: ${{ vars.PPA_TARGET }}
        run: |
          test -n "$PPA_TARGET" || {
            echo 'Repository variable PPA_TARGET is required.' >&2
            exit 1
          }

      - name: Find the latest official stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/repos/jswysnemc/mark-shot/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              release = json.load(response)

          tag = release.get("tag_name", "")
          if release.get("draft") or release.get("prerelease"):
              raise SystemExit("The latest GitHub release is not stable")
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Unexpected stable release tag: {tag}")

          version = tag.removeprefix("v")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag={tag}", file=output)
              print(f"version={version}", file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print(f"Latest official stable release: `{tag}`", file=summary)

      - name: Check whether Launchpad already has the release
        id: ppa
        env:
          PPA_TARGET: ${{ vars.PPA_TARGET }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          match = re.fullmatch(r"ppa:([^/]+)/([^/]+)", os.environ["PPA_TARGET"])
          if not match:
              raise SystemExit("PPA_TARGET must use the ppa:owner/archive format")
          owner, archive = match.groups()
          query = urllib.parse.urlencode({
              "ws.op": "getPublishedSources",
              "source_name": "mark-shot",
              "exact_match": "true",
          })
          url = (
              f"https://api.launchpad.net/1.0/~{owner}/+archive/ubuntu/"
              f"{archive}?{query}"
          )
          with urllib.request.urlopen(url) as response:
              publications = json.load(response)

          version_prefix = f"{os.environ['VERSION']}-"
          matching = [
              entry for entry in publications.get("entries", [])
              if entry.get("source_package_version", "").startswith(version_prefix)
              and entry.get("status") != "Deleted"
          ]
          should_publish = not matching
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"should_publish={str(should_publish).lower()}", file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              if matching:
                  versions = ", ".join(
                      f"`{entry['source_package_version']}` ({entry['status']})"
                      for entry in matching
                  )
                  print(f"Launchpad already contains {versions}; no dispatch needed.", file=summary)
              else:
                  print("The release is missing from Launchpad.", file=summary)

      - name: Check for an active publication run
        if: steps.ppa.outputs.should_publish == 'true'
        id: active
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          import urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
              "/actions/workflows/ppa-publish.yml/runs?per_page=20"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              runs = json.load(response).get("workflow_runs", [])
          active = any(run.get("status") != "completed" for run in runs)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"found={str(active).lower()}", file=output)
          if active:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  print("An existing PPA publication run is active; dispatch deferred.", file=summary)

      - name: Request protected PPA publication
        if: >-
          steps.ppa.outputs.should_publish == 'true' &&
          steps.active.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh workflow run ppa-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --field upstream_tag="$UPSTREAM_TAG" \
            --field ppa_revision=1
          printf 'Requested protected publication for `%s`.\n' "$UPSTREAM_TAG" \
            >> "$GITHUB_STEP_SUMMARY"
